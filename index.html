<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簿記2級 仕訳練習（検索対応）</title><style>:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#1e293b;background:#f1f5f9}body{margin:0;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:1.6rem}p{color:#64748b}.panel{background:white;padding:20px;border-radius:16px;box-shadow:0 4px 18px #0f172a12;margin:18px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.side{min-width:0}h2{font-size:1.05rem}.entry{display:grid;grid-template-columns:minmax(0,1fr) 130px 34px;gap:6px;margin:8px 0}select,input,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px;min-width:0}input{width:100%;box-sizing:border-box}button{cursor:pointer;background:#eef2ff;color:#3730a3;border:0;font-weight:600}button:hover{filter:brightness(.95)}button.primary{background:#4f46e5;color:white} .account-picker{position:relative;min-width:0}.account-search{width:100%;background:#fff;cursor:text}.account-menu{position:absolute;top:calc(100% + 3px);left:0;right:0;max-height:230px;overflow-y:auto;background:white;border:1px solid #cbd5e1;border-radius:9px;box-shadow:0 9px 22px #0f172a25;z-index:20;padding:4px}.account-option{display:block;width:100%;text-align:left;background:white;color:#1e293b;padding:9px 10px;border-radius:5px;font-weight:400}.account-option:hover,.account-option:focus{background:#eef2ff}.account-empty{padding:10px;color:#64748b;font-size:.9rem}.remove{background:#fee2e2;color:#991b1b}.total{font-weight:700;text-align:right;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:700;padding:12px;border-radius:8px;background:#f1f5f9}.ok{background:#dcfce7;color:#166534}.bad{background:#fef3c7;color:#92400e}#history article{border-top:1px solid #e2e8f0;padding:12px 0}small{color:#64748b}.historyline{white-space:pre-wrap;font-size:.92rem} @media(max-width:720px){body{padding:10px}.columns{grid-template-columns:1fr}.entry{grid-template-columns:minmax(0,1fr) 115px 32px}.panel{padding:14px}}.custom-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #e2e8f0}.custom-line span{overflow-wrap:anywhere}.custom-line button{flex-shrink:0} .memo-label{display:block;line-height:1.35}.memo-label #memo{display:block;margin-top:9px}.journal-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.journal-heading h2{margin:0}.journal-heading .remove{font-size:.85rem}</style></head><body><main><h1>📒 簿記2級 仕訳練習</h1><p>勘定科目を漢字・ひらがな・カタカナで検索して選び、金額を入力。商業簿記・工業簿記対応、データはこのブラウザ内に保存されます。</p><section class="panel journal-card"><label class="memo-label">問題番号・メモ（任意） <input id="memo" placeholder="例：商業簿記 第3章 問5"></label><div class="columns"><div class="side"><h2>借方</h2><div id="debits"></div><button id="addDebit">＋ 借方を追加</button><div class="total">合計：<span id="debitTotal">0</span> 円</div></div><div class="side"><h2>貸方</h2><div id="credits"></div><button id="addCredit">＋ 貸方を追加</button><div class="total">合計：<span id="creditTotal">0</span> 円</div></div></div><div id="matchAmountWrap" style="display:none;margin:12px 0"><button type="button" id="matchAmount" class="primary">金額を一致</button></div><div id="status" class="status">勘定科目と金額を入力してください</div><div class="actions" style="margin-top:14px"><button class="primary" id="save">仕訳を履歴に保存</button><button id="reset">入力をクリア</button><button id="exportPng">PNGで保存</button></div></section><div class="actions" id="addJournalArea" style="margin:14px 0 24px"><button type="button" class="primary" id="addJournal">＋ 入力欄を追加</button><button type="button" id="exportAllPng">すべての仕訳をPNGで保存</button><button type="button" id="exportAllPngPlain">番号なし・区切り線付きでPNG保存</button></div><section class="panel"><h2>追加した勘定科目を削除</h2><p style="font-size:.9rem">借方・貸方の科目欄に新しい科目を入力して確定すると、自動で候補に登録されます。ここでは自分で追加した科目だけを削除できます。</p><div id="customAccounts"></div></section><section class="panel"><div class="actions" style="justify-content:space-between;align-items:center"><h2>仕訳履歴</h2><button id="clearHistory" class="remove">履歴を全削除</button></div><div id="history"></div></section></main><script>
const defaults=`現金,小口現金,当座預金,普通預金,定期預金,受取手形,電子記録債権,売掛金,クレジット売掛金,商品,繰越商品,仕入,売上,売上原価,前払金,前受金,未収入金,未払金,未収収益,未払費用,前払費用,前受収益,立替金,預り金,仮払金,仮受金,貸付金,借入金,短期借入金,長期借入金,支払手形,電子記録債務,買掛金,貸倒引当金,貸倒引当金繰入,貸倒損失,償却債権取立益,建物,備品,車両運搬具,土地,機械装置,建設仮勘定,減価償却累計額,建物減価償却累計額,備品減価償却累計額,減価償却費,固定資産売却益,固定資産売却損,のれん,ソフトウェア,特許権,商標権,研究開発費,有価証券,売買目的有価証券,その他有価証券,満期保有目的債券,子会社株式,関連会社株式,投資有価証券,有価証券売却益,有価証券売却損,有価証券評価益,有価証券評価損,その他有価証券評価差額金,受取配当金,受取利息,支払利息,有価証券利息,法人税等,仮払法人税等,未払法人税等,法人税等調整額,繰延税金資産,繰延税金負債,仮払消費税,仮受消費税,未払消費税,資本金,資本準備金,利益準備金,繰越利益剰余金,その他資本剰余金,自己株式,自己株式処分差益,配当金,損益,売上割引,仕入割引,発送費,荷造運賃,給料,賞与,退職給付費用,退職給付引当金,法定福利費,福利厚生費,旅費交通費,通信費,水道光熱費,消耗品費,租税公課,広告宣伝費,支払家賃,受取家賃,保険料,支払保険料,修繕費,雑費,雑損,雑益,棚卸減耗損,商品評価損,火災損失,保険差益,為替差損益,為替差益,為替差損,本店,支店,本社,工場,材料,材料費,直接材料費,間接材料費,労務費,直接労務費,間接労務費,経費,直接経費,間接経費,賃金,賃金・給料,製造間接費,仕掛品,製品,製造,製造原価,売上原価,材料副費,買入部品,外注加工賃,動力費,工場消耗品費,工場減価償却費,工場賃借料,工場保険料,修繕費,間接費配賦差異,製造間接費配賦差異,材料消費価格差異,材料消費数量差異,賃率差異,作業時間差異,予算差異,操業度差異,原価差異,仕損費,棚卸減耗費,月初仕掛品,月末仕掛品,売上高,売上原価,販売費及び一般管理費,営業外収益,営業外費用,特別利益,特別損失`.split(',');
// 勘定科目の読み検索（主要な簿記2級科目の読みを登録）
const readingParts = `現金:げんきん,小口:こぐち,当座:とうざ,普通:ふつう,定期:ていき,預金:よきん,受取:うけとり,手形:てがた,電子:でんし,記録:きろく,債権:さいけん,債務:さいむ,売掛:うりかけ,買掛:かいかけ,商品:しょうひん,繰越:くりこし,仕入:しいれ,売上:うりあげ,原価:げんか,前払:まえばらい,前受:まえうけ,未収:みしゅう,未払:みばらい,収益:しゅうえき,費用:ひよう,立替:たてかえ,預り:あずかり,仮払:かりばらい,仮受:かりうけ,貸付:かしつけ,借入:かりいれ,短期:たんき,長期:ちょうき,貸倒:かしだおれ,引当金:ひきあてきん,繰入:くりいれ,損失:そんしつ,償却:しょうきゃく,取立益:とりたてえき,建物:たてもの,備品:びひん,車両:しゃりょう,運搬具:うんぱんぐ,土地:とち,機械:きかい,装置:そうち,建設:けんせつ,減価:げんか,累計額:るいけいがく,固定:こてい,資産:しさん,売却:ばいきゃく,利益:りえき,のれん:のれん,研究:けんきゅう,開発:かいはつ,特許権:とっきょけん,商標権:しょうひょうけん,有価証券:ゆうかしょうけん,売買目的:ばいばいもくてき,その他:そのた,満期保有目的:まんきほゆうもくてき,子会社:こがいしゃ,関連会社:かんれんがいしゃ,投資:とうし,評価:ひょうか,差額金:さがくきん,配当金:はいとうきん,利息:りそく,支払:しはらい,法人税等:ほうじんぜいとう,調整額:ちょうせいがく,繰延:くりのべ,税金:ぜいきん,消費税:しょうひぜい,資本金:しほんきん,準備金:じゅんびきん,剰余金:じょうよきん,自己株式:じこかぶしき,処分:しょぶん,損益:そんえき,割引:わりびき,発送:はっそう,荷造:にづくり,運賃:うんちん,給料:きゅうりょう,賞与:しょうよ,退職:たいしょく,給付:きゅうふ,法定:ほうてい,福利:ふくり,厚生:こうせい,旅費:りょひ,交通費:こうつうひ,通信費:つうしんひ,水道:すいどう,光熱費:こうねつひ,消耗品:しょうもうひん,租税:そぜい,公課:こうか,広告:こうこく,宣伝費:せんでんひ,家賃:やちん,保険:ほけん,修繕:しゅうぜん,雑費:ざっぴ,雑損:ざっそん,雑益:ざつえき,棚卸:たなおろし,減耗:げんもう,火災:かさい,為替:かわせ,差損益:さそんえき,差益:さえき,差損:さそん,本店:ほんてん,支店:してん,本社:ほんしゃ,工場:こうじょう,材料:ざいりょう,直接:ちょくせつ,間接:かんせつ,労務:ろうむ,経費:けいひ,賃金:ちんぎん,製造:せいぞう,仕掛品:しかかりひん,製品:せいひん,副費:ふくひ,部品:ぶひん,外注:がいちゅう,加工賃:かこうちん,動力費:どうりょくひ,賃借料:ちんしゃくりょう,配賦:はいふ,価格:かかく,数量:すうりょう,賃率:ちんりつ,作業:さぎょう,時間:じかん,予算:よさん,操業度:そうぎょうど,仕損:しそん,月初:げっしょ,月末:げつまつ,売上高:うりあげだか,販売費:はんばいひ,一般管理費:いっぱんかんりひ,営業外:えいぎょうがい,特別:とくべつ,クレジット:くれじっと,ソフトウェア:そふとうぇあ`.split(',').map(x=>x.split(':')).sort((a,b)=>b[0].length-a[0].length);
const readingOverrides = {'現金':'げんきん','仕入':'しいれ','売上':'うりあげ','売掛金':'うりかけきん','買掛金':'かいかけきん','現金過不足':'げんきんかぶそく','減価償却費':'げんかしょうきゃくひ','減価償却累計額':'げんかしょうきゃくるいけいがく','貸倒引当金':'かしだおれひきあてきん','仕掛品':'しかかりひん','有価証券':'ゆうかしょうけん','未払金':'みばらいきん','未収入金':'みしゅうにゅうきん','前払金':'まえばらいきん','前受金':'まえうけきん','仮払金':'かりばらいきん','仮受金':'かりうけきん','預り金':'あずかりきん','立替金':'たてかえきん','貸付金':'かしつけきん','借入金':'かりいれきん','買入部品':'かいいれぶひん','損益':'そんえき','材料':'ざいりょう'};
function toHiragana(s){return s.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/\s/g,'')}
function accountReading(name){if(readingOverrides[name])return readingOverrides[name];let result='',rest=name;while(rest.length){let found=readingParts.find(([k])=>rest.startsWith(k));if(found){result+=found[1];rest=rest.slice(found[0].length)}else{result+=rest[0];rest=rest.slice(1)}}return result}
function matchesAccount(name,query){const q=toHiragana(query);return toHiragana(name).includes(q)||toHiragana(accountReading(name)).includes(q)}
const storage={getItem(k){try{return window.localStorage.getItem(k)}catch(e){return null}},setItem(k,v){try{window.localStorage.setItem(k,v)}catch(e){}},removeItem(k){try{window.localStorage.removeItem(k)}catch(e){}}};let accounts=[...new Set([...defaults,...JSON.parse(storage.getItem('boki_accounts')||'[]')])].sort((a,b)=>a.localeCompare(b,'ja'));let history=JSON.parse(storage.getItem('boki_history')||'[]');function registerAccount(value){let v=value.trim().replace(/\s+/g,' ');if(!v)return '';let existing=accounts.find(a=>a.normalize('NFKC').toLowerCase()===v.normalize('NFKC').toLowerCase());if(existing)return existing;accounts.push(v);accounts.sort((a,b)=>a.localeCompare(b,'ja'));storage.setItem('boki_accounts',JSON.stringify(accounts.filter(x=>!defaults.includes(x))));renderCustomAccounts();return v}function renderCustomAccounts(){let el=document.getElementById('customAccounts');if(!el)return;el.replaceChildren();let custom=accounts.filter(x=>!defaults.includes(x));if(!custom.length){el.textContent='追加した勘定科目はありません。';return}custom.forEach(name=>{let line=document.createElement('div');line.className='custom-line';let label=document.createElement('span');label.textContent=name;let btn=document.createElement('button');btn.className='remove';btn.type='button';btn.textContent='削除';btn.onclick=()=>{accounts=accounts.filter(x=>x!==name);document.querySelectorAll('.account-search').forEach(input=>{if(input.value.trim()===name){input.value='';input.dataset.selected='';const menu=input.parentElement.querySelector('.account-menu');if(menu)menu.hidden=true;}});storage.setItem('boki_accounts',JSON.stringify(accounts.filter(x=>!defaults.includes(x))));renderCustomAccounts();update()};line.append(label,btn);el.append(line)})}let activeCard=document.querySelector('.journal-card');const $=id=>(activeCard&&activeCard.querySelector('[id="'+id+'"]'))||document.getElementById(id);document.addEventListener('pointerdown',e=>{const card=e.target.closest('.journal-card');if(card)activeCard=card},true);document.addEventListener('focusin',e=>{const card=e.target.closest('.journal-card');if(card)activeCard=card},true);const fmt=n=>Number(n||0).toLocaleString('ja-JP');function row(side,account='',amount=''){const owningCard=activeCard;let div=document.createElement('div');div.className='entry';let picker=document.createElement('div');picker.className='account-picker';let sel=document.createElement('input');sel.className='account-search';sel.type='text';sel.autocomplete='off';sel.placeholder='科目名・よみで検索';sel.setAttribute('aria-label',side==='debits'?'借方勘定科目':'貸方勘定科目');sel.dataset.selected=account;sel.value=account;let menu=document.createElement('div');menu.className='account-menu';menu.hidden=true;function showOptions(){activeCard=owningCard;let q=sel.value.trim().normalize('NFKC').toLowerCase();menu.replaceChildren();let matches=accounts.filter(a=>matchesAccount(a,q));matches.slice(0,100).forEach(a=>{let b=document.createElement('button');b.type='button';b.className='account-option';b.textContent=a;b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>{sel.value=a;sel.dataset.selected=a;menu.hidden=true;update();};menu.append(b)});if(!matches.length){let msg=document.createElement('div');msg.className='account-empty';msg.textContent='候補にありません。入力した科目は自動登録できます';menu.append(msg)}menu.hidden=false}sel.addEventListener('focus',showOptions);sel.addEventListener('input',()=>{activeCard=owningCard;sel.dataset.selected='';showOptions();update()});sel.addEventListener('keydown',e=>{activeCard=owningCard;if(e.key==='Escape'){menu.hidden=true;sel.blur()}if(e.key==='Enter'){let first=menu.querySelector('.account-option');if(first&&!menu.hidden&&first.textContent===sel.value.trim()){e.preventDefault();first.click();sel.blur()}else{e.preventDefault();let name=registerAccount(sel.value);sel.value=name;sel.dataset.selected=name;menu.hidden=true;update();sel.blur()}}});sel.addEventListener('blur',()=>setTimeout(()=>{if(!sel.isConnected)return;activeCard=owningCard;if(sel.value.trim()){let name=registerAccount(sel.value);sel.value=name;sel.dataset.selected=name}else{sel.dataset.selected=''}menu.hidden=true;update()},160));picker.append(sel,menu);let inp=document.createElement('input');inp.type='text';inp.className='amount-input';inp.inputMode='numeric';inp.placeholder='金額';inp.setAttribute('aria-label','金額');inp.value=amount?fmt(amount):'';inp.addEventListener('input',()=>{activeCard=owningCard;let v=inp.value.replace(/[^0-9]/g,'');inp.value=v?fmt(v):'';update()});let del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label','行を削除');del.onclick=()=>{activeCard=owningCard;div.remove();update()};div.append(picker,inp,del);$(side).append(div);update()};function entries(side){return [...$(side).querySelectorAll('.entry')].map(r=>({account:r.querySelector('.account-search').dataset.selected||'',amount:Number(r.querySelector('.amount-input').value.replace(/,/g,''))||0}))}function update(){let d=entries('debits'),c=entries('credits'),a=d.reduce((s,x)=>s+x.amount,0),b=c.reduce((s,x)=>s+x.amount,0);$('debitTotal').textContent=fmt(a);$('creditTotal').textContent=fmt(b);let missingSide=a>0&&b===0?'credits':b>0&&a===0?'debits':null;let target=missingSide?$(missingSide).querySelectorAll('.amount-input'):[];$('matchAmountWrap').style.display=missingSide&&target.length===1&&!target[0].value.trim()?'block':'none';let complete=[...d,...c].every(x=>x.account&&x.amount>0)&&d.length&&c.length;let ok=complete&&a===b;$('status').className='status '+(ok?'ok':a!==b?'bad':'');$('status').textContent=ok?'✓ 貸借一致！ 保存できます':a!==b?`貸借差額：${fmt(Math.abs(a-b))} 円（${a>b?'借方':'貸方'}が多い）`:'勘定科目と金額を入力してください';return ok}function reset(){ $('debits').innerHTML='';$('credits').innerHTML='';$('memo').value='';row('debits');row('credits')}function render(){let el=$('history');el.replaceChildren();if(!history.length){el.textContent='保存した仕訳はまだありません。';return}history.forEach((h,i)=>{let a=document.createElement('article');let head=document.createElement('div');let strong=document.createElement('strong');strong.textContent=h.memo||'仕訳 '+(history.length-i);let small=document.createElement('small');small.textContent='　'+h.date;head.append(strong,small);let lines=document.createElement('div');lines.className='historyline';lines.textContent='借方：'+h.debits.map(x=>x.account+' '+fmt(x.amount)).join(' / ')+'\n貸方：'+h.credits.map(x=>x.account+' '+fmt(x.amount)).join(' / ');let btn=document.createElement('button');btn.textContent='この仕訳を再入力';btn.onclick=()=>{reset();$('debits').innerHTML='';$('credits').innerHTML='';h.debits.forEach(x=>row('debits',x.account,x.amount));h.credits.forEach(x=>row('credits',x.account,x.amount));$('memo').value=h.memo;window.scrollTo(0,0)};a.append(head,lines,btn);el.append(a)})} document.addEventListener('pointerdown',e=>{document.querySelectorAll('.account-picker').forEach(p=>{if(!p.contains(e.target))p.querySelector('.account-menu').hidden=true})});function bindJournal(card){activeCard=card;$('addDebit').onclick=()=>row('debits');$('addCredit').onclick=()=>row('credits');$('reset').onclick=reset;$('matchAmount').onclick=()=>{let d=entries('debits'),c=entries('credits');let a=d.reduce((s,x)=>s+x.amount,0),b=c.reduce((s,x)=>s+x.amount,0);let side=a>0&&b===0?'credits':b>0&&a===0?'debits':null;if(!side)return;let inputs=$(side).querySelectorAll('.amount-input');if(inputs.length!==1||inputs[0].value.trim())return;inputs[0].value=fmt(side==='credits'?a:b);update()};$('save').onclick=()=>{if(!update()){alert('勘定科目と金額を入力し、貸借を一致させてください。');return}history.unshift({memo:$('memo').value.trim(),debits:entries('debits'),credits:entries('credits'),date:new Date().toLocaleString('ja-JP')});storage.setItem('boki_history',JSON.stringify(history));render();reset()};}

function exportData(){const d=entries('debits'),c=entries('credits');if(![...d,...c].some(x=>x.account&&x.amount)){alert('書き出す仕訳を入力してください。');return null}return {memo:$('memo').value.trim(),debits:d,credits:c}}
function exportRows(data){let n=Math.max(data.debits.length,data.credits.length);return Array.from({length:n},(_,i)=>[data.debits[i],data.credits[i]])}

function exportAllPng(plain=false){
 const previous=activeCard;
 const cards=[...document.querySelectorAll('.journal-card')];
 const datasets=[];
 cards.forEach((card,i)=>{
   activeCard=card;
   const d=entries('debits'),c=entries('credits');
   if(![...d,...c].some(x=>x.account.trim()||x.amount>0))return;
   datasets.push({memo:card.querySelector('[id="memo"]').value.trim(),debits:d,credits:c,index:i+1});
 });
 activeCard=previous;
 if(!datasets.length){alert('書き出す仕訳を入力してください。');return}
 const W=900,scale=2,top=34,bottom=36,heading=plain?0:92,header=60,rowHeight=64,sectionGap=plain?16:28;
 const heights=datasets.map((d,i)=>heading+(plain&&i>0?0:header)+Math.max(d.debits.length,d.credits.length)*rowHeight+sectionGap);
 const H=top+heights.reduce((a,b)=>a+b,0)+bottom;
 const cv=document.createElement('canvas');cv.width=W*scale;cv.height=H*scale;
 const ctx=cv.getContext('2d');if(!ctx){alert('画像を生成できませんでした');return}
 ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 let y=top;
 datasets.forEach((data,idx)=>{
   if(!plain){ctx.textAlign='left';ctx.fillStyle='#1e293b';ctx.font='bold 32px sans-serif';ctx.fillText('仕訳 '+data.index,42,y+35);
   ctx.font='21px sans-serif';ctx.fillStyle='#475569';if(data.memo)ctx.fillText(data.memo,42,y+73,W-84);}
   const hy=y+heading;
   const visibleHeader=!(plain&&idx>0);
   if(plain&&idx>0){ctx.beginPath();ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;ctx.moveTo(42,hy-8);ctx.lineTo(W-42,hy-8);ctx.stroke();}
   if(visibleHeader){
     ctx.fillStyle='#eef2ff';ctx.fillRect(32,hy,W-64,header);
     ctx.fillStyle='#1e293b';ctx.font='bold 24px sans-serif';
     ['借方科目','金額','貸方科目','金額'].forEach((t,i)=>ctx.fillText(t,[52,320,475,750][i],hy+39));
   }
   ctx.font='22px sans-serif';
   exportRows(data).forEach(([d,c],i)=>{
     const yy=hy+(visibleHeader?header:0)+i*rowHeight;
     ctx.fillStyle=i%2?'#f8fafc':'#fff';ctx.fillRect(32,yy,W-64,rowHeight);
     ctx.fillStyle='#1e293b';
     if(d){ctx.fillText(d.account||'—',52,yy+40,245);ctx.textAlign='right';ctx.fillText(d.amount?fmt(d.amount):'',445,yy+40);ctx.textAlign='left'}
     if(c){ctx.fillText(c.account||'—',475,yy+40,245);ctx.textAlign='right';ctx.fillText(c.amount?fmt(c.amount):'',868,yy+40);ctx.textAlign='left'}
   });
   y+=heights[idx];
 });
 cv.toBlob(blob=>{
   if(!blob){alert('画像を生成できませんでした');return}
   const url=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=url;a.download=safeName()+(plain?'_番号なし':'_まとめ')+'.png';document.body.append(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),30000);
 },'image/png');
}
document.getElementById('exportAllPng').onclick=()=>exportAllPng(false);
document.getElementById('exportAllPngPlain').onclick=()=>exportAllPng(true);

 const title=document.createElement('h2');title.textContent='仕訳 '+(document.querySelectorAll('.journal-card').length+1);

};
